<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="srvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="srvAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="srvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" rx="20" fill="url(#srvBg)" />
  <rect width="598" height="338" x="1" y="1" rx="19" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" />

  <!-- Shield Vector in center -->
  <g transform="translate(300, 150)" filter="url(#srvGlow)">
    <path d="M 0,-70 L 60,-40 L 60,20 C 60,65 0,90 0,90 C 0,90 -60,65 -60,20 L -60,-40 Z" fill="#0f172a" stroke="url(#srvAccent)" stroke-width="3" />
    <path d="M 0,-55 L 45,-30 L 45,15 C 45,50 0,72 0,72 C 0,72 -45,50 -45,15 L -45,-30 Z" fill="#1e1b4b" opacity="0.6" />
    <!-- Check / Bolt inside -->
    <path d="M -5,-35 L -20,5 L 5,5 L -5,35 L 20,-5 L -5,-5 Z" fill="#38bdf8" filter="url(#srvGlow)" />
  </g>

  <!-- Tag Pills -->
  <g transform="translate(90, 60)" filter="url(#srvGlow)">
    <rect width="115" height="28" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1.5" />
    <text x="57" y="19" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">DDoS SHIELD 100G+</text>
  </g>
  <g transform="translate(390, 60)" filter="url(#srvGlow)">
    <rect width="115" height="28" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="57" y="19" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">99.98% UPTIME SLA</text>
  </g>

  <text x="300" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
    STX ENTERPRISES • HIGH-AVAILABILITY CLOUD INFRASTRUCTURE
  </text>
</svg>
