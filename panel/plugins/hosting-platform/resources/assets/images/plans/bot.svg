<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="botBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322" />
      <stop offset="50%" stop-color="#0f2b38" />
      <stop offset="100%" stop-color="#040b14" />
    </linearGradient>
    <linearGradient id="botCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="botGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" rx="20" fill="url(#botBg)" />
  <rect width="598" height="338" x="1" y="1" rx="19" fill="none" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1.5" />

  <!-- Robot Head Graphic -->
  <g transform="translate(300, 150)" filter="url(#botGlow)">
    <!-- Antenna -->
    <line x1="0" y1="-50" x2="0" y2="-75" stroke="#22d3ee" stroke-width="3" />
    <circle cx="0" cy="-80" r="8" fill="#38bdf8" />
    <!-- Head Box -->
    <rect x="-65" y="-50" width="130" height="95" rx="20" fill="#0c1e2e" stroke="url(#botCyan)" stroke-width="3" />
    <!-- Visor -->
    <rect x="-45" y="-30" width="90" height="35" rx="10" fill="#040d16" stroke="#22d3ee" stroke-width="1.5" />
    <!-- Neon Glowing Eyes -->
    <rect x="-30" y="-22" width="16" height="18" rx="4" fill="#22d3ee" />
    <rect x="14" y="-22" width="16" height="18" rx="4" fill="#22d3ee" />
    <!-- Smile Matrix -->
    <line x1="-25" y1="25" x2="25" y2="25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tag Pills -->
  <g transform="translate(90, 60)" filter="url(#botGlow)">
    <rect width="115" height="28" rx="8" fill="rgba(34, 211, 238, 0.2)" stroke="#22d3ee" stroke-width="1.5" />
    <text x="57" y="19" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">DISCORD.JS / PYTHON</text>
  </g>
  <g transform="translate(390, 60)" filter="url(#botGlow)">
    <rect width="115" height="28" rx="8" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="1.5" />
    <text x="57" y="19" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">WHATSAPP &amp; TELEGRAM</text>
  </g>

  <text x="300" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
    STX ENTERPRISES • 24/7 AUTONOMOUS BOT ORCHESTRATION
  </text>
</svg>
