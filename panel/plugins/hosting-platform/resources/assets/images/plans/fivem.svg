<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="fivemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14061e" />
      <stop offset="50%" stop-color="#1c0a1a" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="fivemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" rx="20" fill="url(#fivemBg)" />
  <rect width="598" height="338" x="1" y="1" rx="19" fill="none" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1.5" />

  <!-- Neon Sun / Horizon -->
  <circle cx="300" cy="150" r="85" fill="#f97316" opacity="0.25" filter="url(#fivemGlow)" />
  <circle cx="300" cy="150" r="55" fill="#ef4444" opacity="0.3" filter="url(#fivemGlow)" />

  <!-- Speed lines -->
  <line x1="80" y1="210" x2="520" y2="210" stroke="url(#neonOrange)" stroke-width="3" filter="url(#fivemGlow)" />
  <line x1="120" y1="230" x2="480" y2="230" stroke="#f97316" stroke-width="1.5" opacity="0.6" />
  <line x1="180" y1="250" x2="420" y2="250" stroke="#f97316" stroke-width="1" opacity="0.3" />

  <!-- Supercar Outline Vector -->
  <g transform="translate(190, 110)" filter="url(#fivemGlow)">
    <path d="M 10,75 L 45,55 L 90,45 L 140,45 L 175,60 L 210,70 L 215,80 L 195,85 L 180,85 C 175,70 155,70 150,85 L 70,85 C 65,70 45,70 40,85 L 10,85 Z" fill="#180b29" stroke="url(#neonOrange)" stroke-width="3" />
    <!-- Windshield -->
    <polygon points="50,55 90,48 135,48 150,60" fill="url(#neonCyan)" opacity="0.8" />
    <!-- Wheels -->
    <circle cx="45" cy="85" r="14" fill="#0b0517" stroke="#38bdf8" stroke-width="3" />
    <circle cx="45" cy="85" r="6" fill="#f97316" />
    <circle cx="165" cy="85" r="14" fill="#0b0517" stroke="#38bdf8" stroke-width="3" />
    <circle cx="165" cy="85" r="6" fill="#f97316" />
    <!-- Headlight beam -->
    <polygon points="10,80 -30,70 -30,90" fill="#fef08a" opacity="0.7" filter="url(#fivemGlow)" />
  </g>

  <!-- Tag Pills -->
  <g transform="translate(110, 60)" filter="url(#fivemGlow)">
    <rect width="90" height="28" rx="8" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="1.5" />
    <text x="45" y="19" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">TXADMIN PRO</text>
  </g>
  <g transform="translate(400, 60)" filter="url(#fivemGlow)">
    <rect width="95" height="28" rx="8" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="47" y="19" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">QBCore / ESX</text>
  </g>

  <text x="300" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
    STX ENTERPRISES • HIGH-TICK FIVEM ROLEPLAY CLUSTERS
  </text>
</svg>
