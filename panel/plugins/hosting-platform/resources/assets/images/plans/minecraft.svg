<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#061f1a" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <linearGradient id="diamondGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="20" fill="url(#mcBg)" />
  <rect width="598" height="338" x="1" y="1" rx="19" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Ambient background glow circles -->
  <circle cx="300" cy="170" r="120" fill="#059669" opacity="0.15" filter="url(#glow)" />
  <circle cx="380" cy="120" r="80" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- Grid mesh -->
  <path d="M 50,280 L 550,280 M 100,240 L 500,240 M 150,200 L 450,200" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />

  <!-- Isometric Minecraft Voxel Cube -->
  <g transform="translate(300, 150)">
    <!-- Top Face (Grass / Diamond Cap) -->
    <polygon points="0,-70 70,-30 0,10 -70,-30" fill="#10b981" stroke="#34d399" stroke-width="2" />
    <polygon points="0,-70 35,-50 0,-30 -35,-50" fill="#34d399" opacity="0.4" />
    <!-- Pixel accents on top -->
    <rect x="-20" y="-45" width="12" height="12" fill="#6ee7b7" opacity="0.6" transform="skewX(-30) rotate(30)" />
    <rect x="10" y="-35" width="10" height="10" fill="#a7f3d0" opacity="0.8" transform="skewX(-30) rotate(30)" />

    <!-- Left Face (Dirt / Stone Bedrock) -->
    <polygon points="-70,-30 0,10 0,90 -70,50" fill="#047857" stroke="#10b981" stroke-width="2" />
    <!-- Diamond Inset Pixels Left -->
    <polygon points="-50,-5 -35,5 -35,25 -50,15" fill="url(#diamondGlow)" filter="url(#glow)" />
    <polygon points="-30,20 -15,30 -15,50 -30,40" fill="url(#diamondGlow)" />
    <polygon points="-60,25 -45,35 -45,55 -60,45" fill="#38bdf8" opacity="0.8" />

    <!-- Right Face (Shadow Bedrock) -->
    <polygon points="0,10 70,-30 70,50 0,90" fill="#065f46" stroke="#10b981" stroke-width="2" />
    <!-- Emerald Inset Pixels Right -->
    <polygon points="15,30 30,20 30,40 15,50" fill="url(#emeraldGlow)" filter="url(#glow)" />
    <polygon points="35,5 50,-5 50,15 35,25" fill="url(#emeraldGlow)" />
    <polygon points="45,35 60,25 60,45 45,55" fill="#6ee7b7" opacity="0.7" />
  </g>

  <!-- Floating Voxel Badges -->
  <g transform="translate(140, 100)" filter="url(#glow)">
    <rect width="80" height="30" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="40" y="20" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">PAPER/PURPUR</text>
  </g>

  <g transform="translate(390, 80)" filter="url(#glow)">
    <rect width="85" height="30" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="42" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">20.0 TPS LOCK</text>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="300" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">
    STX ENTERPRISES • ULTRA LOW-LATENCY MINECRAFT ENGINE
  </text>
</svg>
