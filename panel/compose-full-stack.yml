x-common:
  panel:
    &panel-environment
    APP_NAME: "STX Enterprises"
    APP_URL: "http://localhost" # can be set to 'http://localhost' on port 80 only
    LE_EMAIL: "admin@stxenterprises.lk" # email to be used for let's encrypt certificates
    APP_DEBUG: "false"
    APP_ENV: "production"
    APP_INSTALLED: "true"

    # BEHIND_PROXY: true # uncomment to run behind a proxy
    # TRUSTED_PROXIES: 127.0.0.1,172.17.0.1,172.20.0.1 # defaults are for local proxies

  mail:
    &mail-environment
    MAIL_MAILER: "smtp"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "${MAIL_HOST:-smtp.mailgun.org}"
    MAIL_PORT: "${MAIL_PORT:-587}"
    MAIL_FROM: "${MAIL_FROM:-billing@stxenterprises.lk}"
    MAIL_FROM_NAME: "STX Enterprises"
    MAIL_USERNAME: "${MAIL_USERNAME:-}"
    MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"

  database:
    &db-environment
    # Do not remove the "&db-password" from the end of the line below, it is important
    # for Panel functionality.
    MYSQL_ROOT_PASSWORD: "SUPERNEEDSTOCHANGE"
    MYSQL_PASSWORD: &db-password "NEEDSTOCHANGE"
    MYSQL_DATABASE: &db-database "panel"
    MYSQL_USER: &db-username "pelican"

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#

services:
  database:
    image: mariadb:10.11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - pelican-db:/var/lib/mysql
    environment:
      <<: *db-environment

  cache:
    image: redis:alpine
    restart: always

  panel:
    image: ghcr.io/pelican/panel:latest
    build: .
    restart: unless-stopped
    networks:
      - default
    ports:
      - "80:80"
      - "443:443"
      # - "81:80" # if you are behind a proxy uncomment this line and comment out 80 and 443
      # - "9000:9000" # enable when not using caddy to be able to reach php-fpm
    links:
      - database
      - cache
    extra_hosts:
      - "host.docker.internal:host-gateway" # shows the panel on the internal docker network as well. usually '172.17.0.1'
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
      - ./plugins:/var/www/html/plugins
      - ./resources/views/filament/layouts/footer.blade.php:/var/www/html/resources/views/filament/layouts/footer.blade.php
      - ./app/Providers/Filament/FilamentServiceProvider.php:/var/www/html/app/Providers/Filament/FilamentServiceProvider.php
      - ./app/Filament/Admin/Widgets:/var/www/html/app/Filament/Admin/Widgets
      - ./app/Filament/Admin/Pages/Dashboard.php:/var/www/html/app/Filament/Admin/Pages/Dashboard.php
      - ./resources/views/filament/widgets:/var/www/html/resources/views/filament/widgets
      - ./lang/en/admin/dashboard.php:/var/www/html/lang/en/admin/dashboard.php
    environment:
      <<: [*panel-environment, *mail-environment]
      XDG_DATA_HOME: /pelican-data
      # SKIP_CADDY: true # enable when not using caddy.
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"
      DB_CONNECTION: "mariadb"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: *db-database
      DB_USERNAME: *db-username
      DB_PASSWORD: *db-password

volumes:
  pelican-data:
  pelican-logs:
  pelican-db:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
