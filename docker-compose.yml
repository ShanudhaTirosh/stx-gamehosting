# STX Enterprises - production stack: panel + storefront, MariaDB, Redis.
#
#   1. cp .env.example .env   and fill in every value marked REQUIRED
#   2. docker compose up -d --build
#   3. docker compose exec panel php artisan p:user:make     (create your first admin)
#
# Game servers do NOT run in this stack. Install Wings on each game node and add the node under
# Admin > Nodes (see README). The storefront and /status page are served by the panel container.

services:
  database:
    image: mariadb:10.11
    container_name: stx-database
    restart: always
    volumes:
      - stx-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?REQUIRED - set DB_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?REQUIRED - set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-panel}
      MYSQL_USER: ${DB_USER:-pelican}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - stx-network

  cache:
    image: redis:7-alpine
    container_name: stx-cache
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - stx-network

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    image: stx-panel:local
    container_name: stx-panel
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Everything else (plugins, branding, widgets) is baked into the image at build time.
      - stx-panel-data:/pelican-data
      - stx-panel-logs:/var/www/html/storage/logs
    environment:
      APP_NAME: "STX Enterprises"
      APP_URL: "${APP_URL:?REQUIRED - set APP_URL (e.g. https://hosting.example.lk) in .env}"
      APP_DEBUG: "false"
      APP_ENV: "production"
      APP_INSTALLED: "true"
      # Keep the same key forever; losing it makes stored secrets (node tokens, DB passwords) unreadable.
      APP_KEY: "${APP_KEY:?REQUIRED - generate with: echo base64:$$(head -c 32 /dev/urandom | base64)}"
      XDG_DATA_HOME: /pelican-data
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"
      DB_CONNECTION: "mariadb"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-panel}
      DB_USERNAME: ${DB_USER:-pelican}
      DB_PASSWORD: ${DB_PASSWORD:?REQUIRED}
      MAIL_MAILER: "smtp"
      MAIL_HOST: "${MAIL_HOST:-smtp.mailgun.org}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_FROM: "${MAIL_FROM:-billing@stxenterprises.lk}"
      MAIL_FROM_NAME: "STX Enterprises"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      # Hosting platform
      HOSTING_NODE_TAGS: "${HOSTING_NODE_TAGS:-game-node}"
      HOSTING_DATABASE_REMOTE: "${HOSTING_DATABASE_REMOTE:-%}"
    networks:
      - stx-network

volumes:
  stx-db:
  stx-panel-data:
  stx-panel-logs:

networks:
  stx-network:
    driver: bridge
